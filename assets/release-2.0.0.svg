<text x="1520" y="82" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#51606f">v2.0.0 · 3 suites · 25 tasks · 467 assertions</text>

<text x="76" y="236" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="92" font-weight="700" letter-spacing="-3.5" fill="url(#text)">A score you can defend.</text>
