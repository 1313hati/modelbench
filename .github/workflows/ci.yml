name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest

  harness:
    name: suites and self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Every reference solution must score 100%
        run: |
          modelbench validate --suite core-v1
          modelbench validate --suite core-v2
      - name: End-to-end run against the mock model
        run: |
          modelbench self-test --suite core-v1
          modelbench self-test --suite core-v2

  package:
    name: wheel contains the suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check the wheel ships every task file
        run: |
          python - <<'PY'
          import glob, pathlib, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())

          root = pathlib.Path("src/modelbench")
          expected = {
              f"modelbench/{p.relative_to(root).as_posix()}"
              for p in root.rglob("*")
              if p.is_file() and "__pycache__" not in p.parts and not p.name.endswith(".pyc")
          }
          missing = sorted(name for name in expected if name not in names)
          print(f"{len(names)} files in {wheel}; {len(expected)} package files expected")
          assert not missing, f"missing from wheel ({len(missing)}): {missing[:20]}"
          PY
